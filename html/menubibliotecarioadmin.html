<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu do Bibliotecário Administrador-PergByte</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      *{
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="barraHorizontal">
      <div id="imagemUsusario"></div>
    </div>
    <div id="barraVerical">
      <div id="caixaGerenciamento">
        <p>Gerenciamento</p>
        <p>Bibliotecários</p>
        <p>Leitores</p>
        <p>Empréstimos</p>
        <p>Livros/Exemplares</p>
      </div>
      <div id="caixaLeitor">
        <p>Leitura</p>
        <p>Solicitar Agendamento</p>
      </div>
    </div>
      <input
        type="search"
        id="barraPesquisa"
        name="barraDePesquisa"
        placeholder="Digite o título do seu livro"
      />
    </div>
    <div id="resultadoPesquisa"></div>
  </body>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
  <script src="../js/menubibliotecarioadmin.js"></script>
</html>
