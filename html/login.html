<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login-PergByte</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <link rel="stylesheet" type="text/css" href="../css/login.css" />
  </head>
  <body>
    <div id="container">
      <h1>Login</h1>
      <form id="formulario" method="post" action="#" target="_self">
        <input
          type="text"
          class="inputs"
          placeholder="CPF"
          id="inputCPF"
          name="inputDeCPF"
        />
        <input
          type="password"
          class="inputs"
          placeholder="Senha"
          id="inputSenha"
          name="inputDeSenha"
        />
        <button type="button" id="botaoLogin" onclick="logar()">Login</button>
      </form>
    </div>
  </body>
  <script
    type="text/javascript"
    src="https://cdn.jsdelivr.net/npm/toastify-js"
  ></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/login.js"></script>
</html>
